server:
  port: 8091

springfox:
  title: 'FINT SSE Adapter Skeleton'
  version: '@version@'

fint:
  case:
    formats:
      title:
        drosjeloyve: "Drosje - ${tittel} - ${organisasjonsnummer}"
    defaults:
      drosjeloyve:
        journalpostType:
        dokumentType:
        tilknyttetRegistreringSom:
        noekkelord:
  client:
    base-url: https://beta.felleskomponent.no
    oauth:
      access-token-uri: https://idp.felleskomponent.no/nidp/oauth/nam/token
      scope: fint-client
      username:
      password:
      client-id:
      client-secret:

  adapter:
    endpoints:
      sse: /sse/%s
      status: /status
      response: /response
      providers:
        noark: https://beta.felleskomponent.no/arkiv/noark/provider
        kodeverk: https://beta.felleskomponent.no/arkiv/kodeverk/provider
        #personal: https://alpha.felleskomponent.no/administrasjon/personal/provider
        kulturminne: https://beta.felleskomponent.no/arkiv/kulturminnevern/provider
        samferdsel: https://beta.felleskomponent.no/arkiv/samferdsel/provider

  oauth:
    enabled: true
  #    username:
  #    password:
  #    client-id:
  #    client-secret:
  #    access-token-uri:
  #    scope:

  personalressurs:
    refresh-interval: 3600000

security:
  basic:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health, shutdown, prometheus

logging:
  level:
    no.novari.fint.p360: DEBUG
